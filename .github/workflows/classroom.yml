name: Autograding Tests

on:
  - push
  - repository_dispatch

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Contoh 1 dari PDF: gelas 2L & 3L, target 1L -> isi 3L, tuang ke 2L (sisa 1L) = 2 langkah
      - name: Case 01 - Contoh PDF 1 (2 3 1 -> jawab 2)
        id: case-01
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Case 01 - Contoh PDF 1 (2 3 1 -> jawab 2)
          setup-command: gcc -std=c11 -O2 -Wall -Wextra -o soal2 soal2.c
          command: ./soal2
          input: |
            2 3 1
          expected-output: |
            2
          comparison-method: exact
          timeout: 2
          max-score: 5

      # Contoh 2 dari PDF: gelas 3L & 5L, target 4L -> mulai dari 5L butuh 6 langkah
      - name: Case 02 - Contoh PDF 2 (3 5 4 -> jawab 6)
        id: case-02
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Case 02 - Contoh PDF 2 (3 5 4 -> jawab 6)
          setup-command: gcc -std=c11 -O2 -Wall -Wextra -o soal2 soal2.c
          command: ./soal2
          input: |
            3 5 4
          expected-output: |
            6
          comparison-method: exact
          timeout: 2
          max-score: 5

      # Contoh 3 dari PDF: gelas 2L & 3L, target 5L -> melebihi kapasitas gelas terbesar
      - name: Case 03 - Contoh PDF 3 melebihi kapasitas (2 3 5 -> jawab -1)
        id: case-03
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Case 03 - Contoh PDF 3 melebihi kapasitas (2 3 5 -> jawab -1)
          setup-command: gcc -std=c11 -O2 -Wall -Wextra -o soal2 soal2.c
          command: ./soal2
          input: |
            2 3 5
          expected-output: |
            -1
          comparison-method: exact
          timeout: 2
          max-score: 5

      # Takaran sama persis dengan salah satu gelas -> cukup 1 kali isi penuh
      - name: Case 04 - Takaran sama dengan kapasitas gelas (4 7 7 -> jawab 1)
        id: case-04
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Case 04 - Takaran sama dengan kapasitas gelas (4 7 7 -> jawab 1)
          setup-command: gcc -std=c11 -O2 -Wall -Wextra -o soal2 soal2.c
          command: ./soal2
          input: |
            4 7 7
          expected-output: |
            1
          comparison-method: exact
          timeout: 2
          max-score: 5

      # Contoh dari GeeksforGeeks: 4L & 3L, target 2L -> 4 langkah
      - name: Case 05 - Kasus klasik GeeksforGeeks (4 3 2 -> jawab 4)
        id: case-05
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Case 05 - Kasus klasik GeeksforGeeks (4 3 2 -> jawab 4)
          setup-command: gcc -std=c11 -O2 -Wall -Wextra -o soal2 soal2.c
          command: ./soal2
          input: |
            4 3 2
          expected-output: |
            4
          comparison-method: exact
          timeout: 2
          max-score: 5

      # Syarat FPB gagal: FPB(4, 6) = 2, tidak bisa menakar angka ganjil (3L)
      - name: Case 06 - Takaran tidak habis dibagi FPB (4 6 3 -> jawab -1)
        id: case-06
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Case 06 - Takaran tidak habis dibagi FPB (4 6 3 -> jawab -1)
          setup-command: gcc -std=c11 -O2 -Wall -Wextra -o soal2 soal2.c
          command: ./soal2
          input: |
            4 6 3
          expected-output: |
            -1
          comparison-method: exact
          timeout: 2
          max-score: 5

      # Contoh GeeksforGeeks ukuran besar: 38L & 13L, target 18L -> 12 langkah
      - name: Case 07 - Uji gelas menengah (38 13 18 -> jawab 12)
        id: case-07
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Case 07 - Uji gelas menengah (38 13 18 -> jawab 12)
          setup-command: gcc -std=c11 -O2 -Wall -Wextra -o soal2 soal2.c
          command: ./soal2
          input: |
            38 13 18
          expected-output: |
            12
          comparison-method: exact
          timeout: 2
          max-score: 5

      # Lebih optimal menuang dari gelas kecil ke besar: 3L diisi 2x ke 7L = 6L (4 langkah)
      - name: Case 08 - Lebih cepat mulai dari gelas kecil (3 7 6 -> jawab 4)
        id: case-08
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Case 08 - Lebih cepat mulai dari gelas kecil (3 7 6 -> jawab 4)
          setup-command: gcc -std=c11 -O2 -Wall -Wextra -o soal2 soal2.c
          command: ./soal2
          input: |
            3 7 6
          expected-output: |
            4
          comparison-method: exact
          timeout: 2
          max-score: 5

      # Lebih optimal menuang dari gelas besar ke kecil: 7L tuang ke 3L, sisa 4L (2 langkah)
      - name: Case 09 - Lebih cepat mulai dari gelas besar (3 7 4 -> jawab 2)
        id: case-09
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Case 09 - Lebih cepat mulai dari gelas besar (3 7 4 -> jawab 2)
          setup-command: gcc -std=c11 -O2 -Wall -Wextra -o soal2 soal2.c
          command: ./soal2
          input: |
            3 7 4
          expected-output: |
            2
          comparison-method: exact
          timeout: 2
          max-score: 5

      # Kedua gelas tidak saling prima tapi target kelipatan FPB: FPB(6, 9)=3, target 3L (2 langkah)
      - name: Case 10 - Kelipatan FPB lebih dari 1 (6 9 3 -> jawab 2)
        id: case-10
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Case 10 - Kelipatan FPB lebih dari 1 (6 9 3 -> jawab 2)
          setup-command: gcc -std=c11 -O2 -Wall -Wextra -o soal2 soal2.c
          command: ./soal2
          input: |
            6 9 3
          expected-output: |
            2
          comparison-method: exact
          timeout: 2
          max-score: 5

      # Gelas berukuran sama dan target berbeda -> tidak pernah bisa tercapai
      - name: Case 11 - Dua gelas berukuran sama tetapi target berbeda (5 5 3 -> jawab -1)
        id: case-11
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Case 11 - Dua gelas berukuran sama tetapi target berbeda (5 5 3 -> jawab -1)
          setup-command: gcc -std=c11 -O2 -Wall -Wextra -o soal2 soal2.c
          command: ./soal2
          input: |
            5 5 3
          expected-output: |
            -1
          comparison-method: exact
          timeout: 2
          max-score: 5

      # Uji rangkaian tuang panjang: 11L & 7L untuk target 6L -> 10 langkah
      - name: Case 12 - Rangkaian tuang bolak-balik panjang (11 7 6 -> jawab 10)
        id: case-12
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Case 12 - Rangkaian tuang bolak-balik panjang (11 7 6 -> jawab 10)
          setup-command: gcc -std=c11 -O2 -Wall -Wextra -o soal2 soal2.c
          command: ./soal2
          input: |
            11 7 6
          expected-output: |
            10
          comparison-method: exact
          timeout: 2
          max-score: 5

      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          CASE-01_RESULTS: "${{steps.case-01.outputs.result}}"
          CASE-02_RESULTS: "${{steps.case-02.outputs.result}}"
          CASE-03_RESULTS: "${{steps.case-03.outputs.result}}"
          CASE-04_RESULTS: "${{steps.case-04.outputs.result}}"
          CASE-05_RESULTS: "${{steps.case-05.outputs.result}}"
          CASE-06_RESULTS: "${{steps.case-06.outputs.result}}"
          CASE-07_RESULTS: "${{steps.case-07.outputs.result}}"
          CASE-08_RESULTS: "${{steps.case-08.outputs.result}}"
          CASE-09_RESULTS: "${{steps.case-09.outputs.result}}"
          CASE-10_RESULTS: "${{steps.case-10.outputs.result}}"
          CASE-11_RESULTS: "${{steps.case-11.outputs.result}}"
          CASE-12_RESULTS: "${{steps.case-12.outputs.result}}"
        with:
          runners: case-01,case-02,case-03,case-04,case-05,case-06,case-07,case-08,case-09,case-10,case-11,case-12
